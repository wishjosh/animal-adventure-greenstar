name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 테스트가 .mjs에서 .ts 소스를 직접 불러오므로 타입 스트리핑이 기본으로
          # 켜진 Node가 필요하다. Node 20에서는 ERR_UNKNOWN_FILE_EXTENSION이 난다.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 배포 전에 지도 계약·편집·환경·물주기·세 생물 행동 검사를 모두 통과해야 한다.
      - name: Test
        run: npm test

      - name: Type check
        run: npm run check

      - name: Build for Pages
        run: npm run build:pages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/client
